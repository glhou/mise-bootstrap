[bootstrap.mise_shell_activate]
fish = true

[bootstrap.packages]
'brew:fish' = 'latest'
'brew:zellij' = 'latest'
'brew:neovim' = 'latest'
'brew-cask:ghostty' = { os = ['macos']}
'dnf:ghostty' = {os = ["linux"]}

[env]
_.path = ["/opt/homebrew/bin", "/home/linuxbrew/.linuxbrew/bin"]
EDITOR = "nvim"

[tools]
go = "1.25"
uv = "latest"
