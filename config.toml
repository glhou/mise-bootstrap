[bootstrap.mise_shell_activate]
fish = true

[bootstrap.packages]
'brew:fish' = 'latest'
'brew:zellij' = 'latest'
'brew:neovim' = 'latest'
'brew-cask:ghostty' = { os = ['macos']}
'dnf:ghostty' = {os = ["linux"]}

[bootstrap.repos]
"~/.config/nvim" = { url = "git@github.com:glhou/kickstart.nvim.git", ref="master"}
"~/.config/zellij" = { url = "git@github.com:glhou/zellij-config.git", ref="main"}

[env]
_.path = ["/opt/homebrew/bin", "/home/linuxbrew/.linuxbrew/bin"]
EDITOR = "nvim"

[tools]
go = "1.25"
uv = "latest"
rust-analyzer = "latest"
npm = "latest"
stylua = "latest"
lua-language-server = "latest"
